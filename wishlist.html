<!DOCTYPE html>
<html>
    <head>
        <title>Movie Hub</title>

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="Styles/nav-bar.css">
        <link rel="stylesheet" href="Styles/wishlist.css">
        <link rel="stylesheet" href="Styles/movie-card.css">
        <link rel="stylesheet" href="Styles/filter.css">
        <link rel="stylesheet" href="Styles/animetion.css">
        <link rel="stylesheet" href="Styles/movie-details.css">
    </head>
    <body>
        <div class="nav-bar">
            <div class="logo">
                <img class="logo-image" src="images/site/film.svg">
                <p class="logo-text">MOVIE HUB</p>
            </div>
            <div class="menu">
                <div class="icon">
                    <img class="menu-icon menu-open" src="images/site/icons8-menu-button.svg">
                </div>
                <div class="links">
                    <img class="menu-icon close-btn" src="images/site/icons8-close.svg">
                    <a href="index.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/film.svg">
                            Home
                        </button>   
                    </a>
                    <a href="trending.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/trending-up.svg">
                            Trending
                        </button>   
                    </a>
                    <a href="movies.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/film-clapperboard.svg">
                            Movies
                        </button>   
                    </a>
                    <a href="tv-series.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/tv.svg">
                            TV Series
                        </button>   
                    </a>
                    <a href="#">
                        <button class="nav-bar-button  nav-bar-button-focus">
                            <img class="nav-bar-icon" src="images/site/heart.svg">
                            Wishlist
                        </button>   
                    </a>
                </div>    
            </div>
        </div>

        <div class="pop-up hidden-popup">
            <div class="movie-details">
                <img class="movie-details-close js-movie-details-close" src="images/site/icons8-close.svg">
                <img class="movie-image" src="images/movie-thumbnails/couple-with-sign.jpg">
                <div class="details">
                    <div class="title js-title"></div>
                    <div class="description js-description"></div>
                    <div class="section">
                        <div class="section-title">
                            Genre:
                        </div>
                        <div class="content js-genre-content">
                            action, adventure
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-title">
                            Release Date:
                        </div>
                        <div class="content js-release-date-section">
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-title">
                            Language:
                        </div>
                        <div class="content js-language-content">
                        </div>
                    </div>
                    <div class="section">
                        <div class="section-title">
                            Ratings:
                        </div>
                        <div class="content js-rating-content">
                        </div>
                    </div>
                    <button class="site-link-button js-site-link-button">Watch In Site</button>
                </div>
            </div>

            <div class="loading hidden-js-popup-loading">
                <img class="loading-image" src="images/site/icons8-loading-100.png">
                Loading...
            </div>
        </div>

        <div class="page-reveal">
            <div class="wishlist">
                <div class="wishlist-title">
                    <img class="wishlist-image" src="images/site/heart.svg">
                    <p>My Wishlist</p>
                </div>

                <div class="movies-container js-movie-container">
                </div>
                <div class="loading js-loading hidden">
                    <img class="loading-image" src="images/site/icons8-loading-100.png">
                    Loading...
                </div> 
            </div>
        </div>
        <div class="scripts">
            <script src="styles-js/nav-bar.js"></script>
            <script src="data/wishlist.js" type="module"></script>
            <script src="data/movie-details.js" type="module"></script>
        </div>
    </body>
</html>
