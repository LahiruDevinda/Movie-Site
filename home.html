<!DOCTYPE html>
<html>
    <head>
        <title>Movie Hub</title>

        <link rel="stylesheet" href="Styles/nav-bar.css">
        <link rel="stylesheet" href="Styles/home.css">
        <link rel="stylesheet" href="Styles/movie-card.css">
        <link rel="stylesheet" href="Styles/animetion.css">
    </head>
    <body>
        <div class="nav-bar">
            <div class="logo">
                <img class="logo-image" src="images/site/film.svg">
                <p class="logo-text">MOVIE HUB</p>
            </div>
            <div class="menu">
                <div class="icon">
                    <img class="menu-icon menu-open" src="images/site/icons8-menu-button.svg">
                </div>
                <div class="links">
                    <img class="menu-icon close-btn" src="images/site/icons8-close.svg">
                    <a href="#">
                        <button class="nav-bar-button nav-bar-button-focus">
                            <img class="nav-bar-icon" src="images/site/film.svg">
                            Home
                        </button>   
                    </a>
                    <a href="trending.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/trending-up.svg">
                            Trending
                        </button>   
                    </a>
                    <a href="movie.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/film-clapperboard.svg">
                            Movies
                        </button>   
                    </a>
                    <a href="tv-series.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/tv.svg">
                            TV Series
                        </button>   
                    </a>
                    <a href="wishlist.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/heart.svg">
                            Wishlist
                        </button>   
                    </a>
                </div>    
            </div>
        </div>
        <div class="page-reveal">
            <div class="middle-section">
                <div class="greeting-text">
                    Welcome to Movie Hub
                </div>
                <div class="search">
                    <input class="search-bar" type="text" placeholder="Search for movies, TV series...">
                    <button class="search-button"><img class="search-icon" src="images/site/search-icon.svg"></button>
                </div>
            </div>
            <div class="featured-movies">
                <div class="featured-movie-title">
                    <img class="featured-movie-star" src="images/home/shine-star-cluster.png">
                    <p>popular Movies & TV Series</p>
                </div>

                <div class="movies-container js-movies-container">

                </div>
            </div>
        </div>
        
        <div class="scripts">
            <script src="styles-js/nav-bar.js"></script>
            <script src="data/popular-movies.js" type="module"></script>
        </div>
    </body>
</html>
