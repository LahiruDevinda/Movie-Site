<!DOCTYPE html>
<html>
    <head>
        <title>Movie Hub</title>

        <link rel="stylesheet" href="Styles/nav-bar.css">
        <link rel="stylesheet" href="Styles/movies.css">
        <link rel="stylesheet" href="Styles/movie-card.css">
        <link rel="stylesheet" href="Styles/filter.css">
        <link rel="stylesheet" href="Styles/animetion.css">
    </head>
    <body>
        <div class="nav-bar">
            <div class="logo">
                <img class="logo-image" src="images/site/film.svg">
                <p class="logo-text">MOVIE HUB</p>
            </div>
            <div class="menu">
                <div class="icon">
                    <img class="menu-icon menu-open" src="images/site/icons8-menu-button.svg">
                </div>
                <div class="links">
                    <img class="menu-icon close-btn" src="images/site/icons8-close.svg">
                    <a href="home.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/film.svg">
                            Home
                        </button>   
                    </a>
                    <a href="trending.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/trending-up.svg">
                            Trending
                        </button>   
                    </a>
                    <a href="#">
                        <button class="nav-bar-button nav-bar-button-focus">
                            <img class="nav-bar-icon" src="images/site/film-clapperboard.svg">
                            Movies
                        </button>   
                    </a>
                    <a href="tv-series.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/tv.svg">
                            TV Series
                        </button>   
                    </a>
                    <a href="wishlist.html">
                        <button class="nav-bar-button">
                            <img class="nav-bar-icon" src="images/site/heart.svg">
                            Wishlist
                        </button>   
                    </a>
                </div>    
            </div>
        </div>
        <div class="page-reveal">
            <div class="movies">
                <div class="title">
                    <img class="movie-image" src="images/site/film-clapperboard.svg">
                    <p>Movies</p>
                </div>

                <div class="middle-section">
                    <input class="search-bar js-filter-search-bar" type="text" placeholder="Search trending content...">
                    <div class="filter">
                        <div class="filter-title">
                            <img class="filter-title-image" src="images/filter/filter.png">
                            <h6 class="filter-title-text">Filter</h6>
                        </div>
                        <div class="genre-section">
                            <label class="filter-label">Genre</label>
                            <div class="genre-buttons">
                                <button class="genre js-genre">Action</button>
                                <button class="genre js-genre">Adventure</button>
                                <button class="genre js-genre">Biography</button>
                                <button class="genre js-genre">Comedy</button>
                                <button class="genre js-genre">Crime</button>
                                <button class="genre js-genre">Drama</button>
                                <button class="genre js-genre">Fantasy</button>
                                <button class="genre js-genre">History</button>
                                <button class="genre js-genre">Horror</button>
                                <button class="genre js-genre">Sci-Fi</button>
                                <button class="genre js-genre">Thriller</button>
                                <button class="genre js-adult-button">Adults</button>
                            </div>
                        </div>
                        <div class="year-section">
                            <label for="filter-year" class="filter-label">Year</label>
                            <select class="filter-year js-filter-year" id="year" name="year">
                                <option value="ALL">ALL</option>
                                <option value="2026">2026</option>
                                <option value="2025">2025</option>
                                <option value="2024">2024</option>
                                <option value="2023">2023</option>
                                <option value="2022">2022</option>
                                <option value="2021">2021</option>
                                <option value="2020">2020</option>
                                <option value="2019-2010">2019 - 2010</option>
                                <option value="2009-2000">2009 - 2000</option>
                            </select>
                        </div>
                        <button class="clear-button js-clear-button">Clear</button>
                    </div>
                </div>

                <div class="movies-container js-movies-container">
                </div>
            </div>    
        </div>
        <div class="scripts">
            <script src="styles-js/nav-bar.js"></script>
            <script src="data/movies.js" type="module"></script>
            <script src="utils/filter.js" type="module"></script>
            <script src="data/wishlist.js" type="module"></script>
        </div>
    </body>
</html>
